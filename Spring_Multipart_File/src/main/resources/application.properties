spring.application.name=Spring_Multipart_File
# Maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=5GB

# Maximum size allowed for the entire multipart/form-data request
spring.servlet.multipart.max-request-size=5GB

# Files above 2MB are instantly streamed to disk instead of JVM memory
spring.servlet.multipart.file-size-threshold=2MB

# Optional: Specify a custom fast-write temporary directory for uploads
spring.servlet.multipart.location=D://my-all-projects/Spring_Multipart_File/var/tmp

# Delays multipart parsing until the controller explicitly requests it
spring.servlet.multipart.resolve-lazily=true
