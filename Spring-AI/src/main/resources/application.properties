spring.application.name=Spring-AI
spring.ai.model.chat=openai
spring.ai.openai.api-key=test
# For Spring AI 2.0.0-M6 workaround
spring.ai.openai.chat.base-url=http://localhost:12434/engines/v1
# Use exact model id from your /models response
spring.ai.openai.chat.options.model=smollm2:360M-Q4_K_M
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.maxTokens=300
# Docker Model Runner does not support embeddings
spring.ai.openai.embedding.enabled=false